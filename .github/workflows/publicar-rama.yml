name: Preparar la web para el hosting

# Compila la web y deja el resultado en la rama "publicado", junto con un
# manifiesto que dice qué archivos hay y el hash de cada uno.
#
# El hosting (panel/publicar.php) lee ese manifiesto, compara con lo que ya
# tiene y se descarga solo lo que ha cambiado. Así no hacen falta credenciales
# de FTP: el hosting tira de GitHub, en vez de GitHub empujar al hosting.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar-rama
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  preparar:
    name: Compilar y dejar en la rama publicado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:static
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://explorasiam.com' }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}

      - name: Escribir el manifiesto
        working-directory: dist
        run: python3 ../scripts/manifiesto.py "$GITHUB_SHA"

      - name: Publicar en la rama publicado
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web compilada desde ${GITHUB_SHA:0:7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:publicado
          echo "Listo. El hosting ya puede recoger esta versión." >> "$GITHUB_STEP_SUMMARY"
