<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Sacramento&amp;display=swap">
  <style>
    body { margin: 0; background: #FBF3E6; color: #2A0E14; font-family: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 400; -webkit-font-smoothing: antialiased; }
    a { color: #7A2545; text-decoration: none; } a:hover { color: #2A0E14; }
    .display { font-family: "Anton", "Impact", "Arial Narrow Bold", sans-serif; font-weight: 400; text-transform: uppercase; letter-spacing: 0.01em; }
    .label { font-family: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif; font-style: normal; font-size: 14px; letter-spacing: 0.02em; text-transform: none; font-weight: 600; }
    .ph { border-bottom: 1px dashed #F07060; }
    .fill { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; filter: contrast(1.06) saturate(1.2) sepia(0.06); }
  </style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBF3E6;">
  <!-- nav ya en estado "scrolled": marfil + blur -->
  <nav style="position: absolute; top: 0; left: 0; right: 0; height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; background: rgba(251,243,230,0.86); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(42,14,20,0.12); z-index: 2;">
    <div style="display: flex; align-items: center; gap: 10px;"><img src="logo.png" alt="Explora Siam" style="width: 40px; height: 40px; display: block;"><div style="font-family: 'Archivo', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700;">Explora Siam</div></div>
    <div style="width: 44px; height: 44px; display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: center;"><div style="width: 22px; height: 1.5px; background: #2A0E14;"></div><div style="width: 22px; height: 1.5px; background: #2A0E14;"></div></div>
  </nav>

  <!-- contenido a mitad de scroll: salidas -->
  <div style="position: absolute; top: 60px; left: 0; right: 0; display: flex; flex-direction: column; gap: 24px; padding-top: 28px;">
    <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 10px;">
      <div class="label" style="color: #7A2545;">Próximas salidas, 2026 y 2027</div>
      <h2 class="display" style="margin: 0; font-size: 40px; line-height: 1;">Elige cuándo.</h2>
    </div>
    <div style="display: flex; gap: 12px; padding-left: 20px; width: 800px;">
      <div style="flex: 0 0 330px; display: flex; flex-direction: column; border: 1px solid rgba(42,14,20,0.14); border-radius: 4px; overflow: hidden;">
        <div style="position: relative; height: 380px; overflow: hidden;"><img src="sukhothai-45.jpg" class="fill" alt=""><div class="label" style="position: absolute; top: 12px; left: 12px; background: #7A2545; color: #FBF3E6; padding: 5px 8px; border-radius: 2px;">Últimas plazas</div></div>
        <div style="padding: 18px; display: flex; flex-direction: column; gap: 12px;">
          <h3 class="display" style="margin: 0; font-size: 26px; line-height: 1.05;">Norte profundo: Chiang Mai, Pai y Doi Inthanon</h3>
          <div class="label" style="color: #6E5A58; display:flex; flex-wrap: wrap; gap: 4px 8px;"><span class="ph">12 – 26 nov 2026</span><span>·</span><span>15 días</span><span>·</span><span class="ph" style="color:#F07060;">quedan 4</span></div>
          <div class="display" style="font-size: 24px;">desde <span class="ph">2.890 €</span></div>
        </div>
      </div>
      <div style="flex: 0 0 330px; display: flex; flex-direction: column; border: 1px solid rgba(42,14,20,0.14); border-radius: 4px; overflow: hidden;">
        <div style="position: relative; height: 380px; overflow: hidden;"><img src="templo-45.jpg" class="fill" alt=""></div>
        <div style="padding: 18px;"><h3 class="display" style="margin: 0; font-size: 26px; line-height: 1.05;">Templos, ríos y mercados</h3></div>
      </div>
    </div>
  </div>

  <!-- barra inferior fija -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: rgba(251,243,230,0.94); backdrop-filter: blur(12px); border-top: 1px solid rgba(42,14,20,0.12); padding: 10px 16px 18px; display: flex; flex-direction: column; gap: 8px; z-index: 3;">
    <div class="label" style="color: #6E5A58; text-align: center;"><span class="ph">Norte de Tailandia</span> · <span class="ph">12 nov</span> · <span class="ph" style="color:#F07060;">4 plazas</span></div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 999px; background: #F07060; color: #2A0E14; font-family: 'Archivo', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2A0E14" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.3-3.9A8 8 0 1 1 8.1 19L4 20z"></path><path d="M9.5 9.5c.2 2.2 2.8 4.8 5 5l1.4-1.3-1.9-1-1 .7c-.9-.4-1.6-1.1-2-2l.7-1-1-1.9L9.5 9.5z"></path></svg>
      Hablemos por WhatsApp
    </div>
  </div>
</div>
</x-dc>
